<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0a0c1e">
<meta name="description" content="Kum Dök: çizgi çiz, kumu bardaklara dök. 115 bölümlük fizik bulmacası.">
<title>Kum Dök</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main id="app">
 <section id="home" class="screen">
  <canvas id="homeCv" aria-hidden="true"></canvas>
  <div class="homeUi">
   <h1 class="logo">KUM DÖK</h1>
   <p class="tag">Çiz · Dök · Çevir</p>
   <button class="btn primary" id="btnPlayMain" type="button">Oyna</button>
   <button class="btn daily" id="btnDaily" type="button"><span><b>Günlük Bulmaca</b><small id="dailySub">Bugünün bulmacası hazır</small></span><span class="st"><span id="streak">0 gün</span><small>seri</small></span></button>
   <div class="row2"><button class="btn" id="btnLevels" type="button">Bölümler</button><button class="btn" id="btnColl" type="button">Kum Koleksiyonu</button></div>
   <button class="btn" id="btnStats" type="button">İstatistik ve Rozetler</button>
   <div class="toggles"><button class="tg" id="tgMusic" type="button" aria-label="Müzik">♪ Müzik</button><button class="tg" id="tgSound" type="button" aria-label="Oyun sesleri">Ses</button><button class="tg" id="tgVib" type="button">Titreşim</button><button class="tg" id="tgLine" type="button">Çizgi</button></div>
   <div class="giftBar" id="giftBar" hidden></div>
   <div class="tot"><b id="totStars">0</b> yıldız toplandı</div>
  </div>
 </section>
 <section id="levels" class="screen" hidden>
  <div class="topbar"><button class="round" id="bk1" type="button" aria-label="Geri">←</button><div><h2 class="pgTitle" id="wName">Bölümler</h2><div class="pgSub" id="wDesc">Her bölüm yeni bir şey öğretir</div></div></div>
  <div class="wbar"><div class="wtabs" id="worldTabs"></div><div class="wprog" id="wProg"></div></div>
  <div class="scroll"><div class="grid lv" id="lvGrid"></div></div>
 </section>
 <section id="collection" class="screen" hidden>
  <div class="topbar"><button class="round" id="bk2" type="button" aria-label="Geri">←</button><div><h2 class="pgTitle">Kum Koleksiyonu</h2><div class="pgSub"><span id="skTotal">0</span> yıldız · yıldızla yeni kum açılır</div></div></div>
  <div class="scroll"><div class="grid" id="skGrid"></div></div>
 </section>
 <section id="stats" class="screen" hidden>
  <div class="topbar"><button class="round" id="bk3" type="button" aria-label="Geri">←</button><div><h2 class="pgTitle">İstatistik</h2><div class="pgSub">Gelişimin ve rozetlerin</div></div></div>
  <div class="scroll"><div class="stats" id="stGrid"></div><h2 class="sec">Rozetler</h2><ul class="ach" id="achList"></ul></div>
 </section>
 <section id="game" class="screen" hidden>
  <header class="hud">
   <button class="round" id="btnBack" type="button" aria-label="Menü">←</button>
   <h1><span id="lvTitle"></span></h1>
   <button class="round hintBtn" id="btnHint" type="button" aria-label="İpucu">💡<em id="hintN">3</em></button>
   <div class="bars">
    <div class="bar1" id="inkWrap"><label>ÇİZGİ</label><div class="track"><i id="inkFill"></i></div></div>
    <div class="bar1"><label>KUM</label><div class="track"><i id="sandFill"></i></div></div>
   </div>
   <div id="hint"></div>
  </header>
  <div class="stage"><canvas id="cv"></canvas></div>
  <footer class="tools">
   <button class="tool" id="btnUndo" type="button"><b>↶</b>Geri al</button>
   <button class="tool" id="btnRestart" type="button"><b>↻</b>Yeniden</button>
   <button class="tool go" id="btnPlay" type="button"><b>▶</b>Başlat</button>
   <button class="tool fl" id="btnFlip" type="button" hidden><em id="flipCount">0</em><b>⇅</b>Çevir</button>
  </footer>
  <div id="toast" hidden></div>
  <div id="modal" hidden>
   <div class="card">
    <h2 id="mTitle"></h2>
    <div class="stars" id="mStars"></div>
    <p id="mText"></p><p id="mText2"></p>
    <div class="acts">
     <button class="btn primary" id="mNext" type="button" style="font-size:20px;min-height:54px">Sonraki ▶</button>
     <button class="btn" id="mAgain" type="button">Tekrar dene</button>
     <button class="btn hintCta" id="mHint" type="button" hidden>💡 İpucuyla tekrar dene</button>
     <button class="btn" id="mSkip" type="button" hidden>Bölümü atla</button>
     <button class="btn" id="mMenu" type="button">Menü</button>
    </div>
   </div>
  </div>
 </section>
</main>

<script src="js/engine.js"></script>
<script src="js/levels.js"></script>
<script src="js/levels-data.js"></script>
<script src="js/save.js"></script>
<script src="js/audio.js"></script>
<script src="js/game.js"></script>
<script>
/* web sitesi olarak açılınca: çevrimdışı çalışma ve "Ana ekrana ekle" (Android uygulamasında gerekmez) */
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)&&!window.Capacitor){
  window.addEventListener('load',function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
}
</script>
</body>
</html>
